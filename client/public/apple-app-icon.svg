<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Apple System Blue -> Apple System Mint -> Apple System Green -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="55%" stop-color="#00a389" />
      <stop offset="100%" stop-color="#34c759" />
    </linearGradient>

    <!-- Liquid Glass Top Specular Sheen Gradient -->
    <linearGradient id="glass-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glass Diagonal Reflection -->
    <linearGradient id="glass-refl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter for Ambient Elevation -->
    <filter id="apple-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#001830" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Inner Shadow for Beveled Glass Rim -->
    <filter id="glyph-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Group with Apple Squircle Geometry -->
  <g filter="url(#apple-shadow)">
    <!-- Apple Superellipse Continuous Squircle (Radius 22.37% at 512x512) -->
    <path
      d="M 115 16
         C 38 16 16 38 16 115
         L 16 397
         C 16 474 38 496 115 496
         L 397 496
         C 474 496 496 474 496 397
         L 496 115
         C 496 38 474 16 397 16
         Z"
      fill="url(#bg-grad)"
    />

    <!-- Diagonal Glass Reflective Overlay -->
    <path
      d="M 115 16
         C 38 16 16 38 16 115
         L 16 260
         Q 256 360 496 160
         L 496 115
         C 496 38 474 16 397 16
         Z"
      fill="url(#glass-refl)"
    />

    <!-- Apple Liquid Glass Specular Top Highlight Rim (1.5px optical edge) -->
    <path
      d="M 115 18
         C 40 18 20 40 18 115
         L 18 135
         C 20 60 60 20 135 18
         L 377 18
         C 452 20 492 60 494 135
         L 494 115
         C 492 40 472 18 397 18
         Z"
      fill="url(#glass-specular)"
    />

    <!-- Bottom Occlusion Rim -->
    <path
      d="M 22 397
         C 26 465 47 486 115 492
         L 397 492
         C 465 486 486 465 490 397
         L 490 401
         C 486 471 465 494 397 496
         L 115 496
         C 47 494 26 471 22 401
         Z"
      fill="#000000"
      opacity="0.25"
    />
  </g>

  <!-- Central Apple Glyph: Procurement Tote / Market Cart + Organic Leaf + AI Star -->
  <g filter="url(#glyph-glow)">
    <!-- Shopping / Procurement Bag Silhouette with Smooth Apple Corners -->
    <path
      d="M 166 210
         C 166 198 176 188 188 188
         L 324 188
         C 336 188 346 198 346 210
         L 362 368
         C 364 388 348 406 328 406
         L 184 406
         C 164 406 148 388 150 368
         Z"
      fill="#ffffff"
      fill-opacity="0.96"
    />

    <!-- Bag Handles Arc (Classic Apple Tote Handle) -->
    <path
      d="M 206 188
         L 206 148
         C 206 120 228 98 256 98
         C 284 98 306 120 306 148
         L 306 188"
      fill="none"
      stroke="#ffffff"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Organic Sprout / Fresh Leaf (Farmers Market Green Emblem) -->
    <path
      d="M 256 230
         C 292 230 316 260 316 295
         C 316 338 274 358 256 366
         C 238 358 196 338 196 295
         C 196 260 220 230 256 230
         Z"
      fill="url(#bg-grad)"
    />

    <!-- Leaf Center Stem Vein -->
    <path
      d="M 256 362 L 256 256"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linecap="round"
      opacity="0.9"
    />

    <!-- Apple AI Copilot 4-Point Brilliance Star (Upper Right Accent) -->
    <g transform="translate(356, 126)">
      <path
        d="M 0 -36
           C 0 -10 10 0 36 0
           C 10 0 0 10 0 36
           C 0 10 -10 0 -36 0
           C -10 0 0 -10 0 -36
           Z"
        fill="#ffffff"
        opacity="0.98"
      />
      <!-- Star Inner Glow -->
      <circle cx="0" cy="0" r="7" fill="#ffe066" opacity="0.95" />
    </g>

    <!-- Secondary Micro Star (Bottom Left) -->
    <g transform="translate(142, 330) scale(0.48)">
      <path
        d="M 0 -32
           C 0 -9 9 0 32 0
           C 9 0 0 9 0 32
           C 0 9 -9 0 -32 0
           C -9 0 0 -9 0 -32
           Z"
        fill="#ffffff"
        opacity="0.9"
      />
    </g>
  </g>
</svg>
