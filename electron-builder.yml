appId: com.farmersmarket.workspace
productName: FM Workspace
copyright: Copyright © 2026 Farmers Market

directories:
  output: dist-electron
  buildResources: build

asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/argon2/**"

files:
  - "electron/dist/**/*"
  - "server/dist/**/*"
  - "client/dist/**/*"
  - "package.json"
  - "!**/*.ts"
  - "!**/*.map"

extraResources:
  - from: "server/dist"
    to: "server/dist"
  - from: "client/dist"
    to: "client/dist"
  - from: "server/node_modules"
    to: "server/node_modules"
  - from: "build/icon.ico"
    to: "icon.ico"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "FM Workspace"
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false
