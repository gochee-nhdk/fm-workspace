services:
  - type: web
    name: farmers-market-procurement-api
    env: node
    plan: free # Zero-Cost Free Web Service on Render
    region: singapore
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        value: admin@farmersmarket.vn
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
