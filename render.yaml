services:
  - type: web
    name: farmers-market-procurement-api
    env: node
    plan: free
    region: singapore
    buildCommand: cd server && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
