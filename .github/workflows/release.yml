name: Build & Release Portable Web App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm run install:all

      - name: Build production client
        run: npm run build

      - name: Package Vercel Full-Stack Release
        run: |
          mkdir -p release-pkg
          cp -r api client/dist shared package.json vercel.json .env.example release-pkg/
          cd release-pkg && zip -r ../FM-Workspace-Release.zip . && cd ..
          sha256sum FM-Workspace-Release.zip > checksums.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            FM-Workspace-Release.zip
            checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
