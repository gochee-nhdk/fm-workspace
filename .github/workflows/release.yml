name: Build & Release Portable Web App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install --legacy-peer-deps
          npm --prefix server run db:init

      - name: Build frontend and backend
        run: npm run build:all

      - name: Package Portable Web App Release
        run: |
          mkdir -p release-pkg
          cp -r server client package.json *.bat *.sh *.vbs logo.ico scripts release-pkg/
          rm -rf release-pkg/client/src release-pkg/server/src
          cd release-pkg && zip -r ../FM-Workspace-Local.zip . && cd ..
          sha256sum FM-Workspace-Local.zip > checksums.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            FM-Workspace-Local.zip
            checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
