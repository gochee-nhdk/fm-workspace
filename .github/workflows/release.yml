name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix server install
          npm --prefix client install --legacy-peer-deps

      - name: Build frontend and backend
        run: npm run build:all

      - name: Build Electron shell
        run: npm run build:electron

      - name: Package Windows Desktop App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win -p always

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-FileHash -Path "dist-electron/*.exe" -Algorithm SHA256 | Out-File -FilePath "dist-electron/checksums.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/*.yml
            dist-electron/checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
